name: LifePulse
options:
  bundleIdPrefix: com.lifepulse
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  LifePulseCore:
    path: ..

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LifePulseApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LifePulseApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifepulse.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: LifePulse
        CODE_SIGN_ENTITLEMENTS: LifePulseApp/LifePulseApp.entitlements
    entitlements:
      path: LifePulseApp/LifePulseApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lifepulse.shared
    dependencies:
      - package: LifePulseCore
        product: LifePulseCore
      - target: LifePulseWidgetExtension
        embed: true

  LifePulseWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LifePulseWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifepulse.app.widget
        INFOPLIST_KEY_CFBundleDisplayName: LifePulse Widgets
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: LifePulseWidget/LifePulseWidget.entitlements
    info:
      path: LifePulseWidget/Info.plist
      properties:
        CFBundleDisplayName: LifePulse Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LifePulseWidget/LifePulseWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lifepulse.shared
    dependencies:
      - package: LifePulseCore
        product: LifePulseCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  LifePulseApp:
    build:
      targets:
        LifePulseApp: all
        LifePulseWidgetExtension: all
    run:
      config: Debug
  LifePulseWidgetExtension:
    build:
      targets:
        LifePulseWidgetExtension: all
        LifePulseApp: all
    run:
      config: Debug
