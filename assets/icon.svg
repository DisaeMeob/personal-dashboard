<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E101D" />
      <stop offset="50%" stop-color="#1A1B35" />
      <stop offset="100%" stop-color="#090A10" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E5CE6" />
      <stop offset="50%" stop-color="#BF5AF2" />
      <stop offset="100%" stop-color="#FF375F" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30D158" />
      <stop offset="100%" stop-color="#64D2FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="4" />

  <!-- Outer Activity & Finance Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="26" />
  <circle
    cx="256" cy="256" r="176"
    fill="none"
    stroke="url(#ringGrad)"
    stroke-width="26"
    stroke-dasharray="780 1106"
    stroke-linecap="round"
    transform="rotate(-90 256 256)"
  />

  <!-- Pulse Waveform -->
  <path
    d="M118 264 H178 L212 178 L260 342 L302 218 L328 264 H394"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>
